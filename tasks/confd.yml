---
# Bibliothèque conf.d + extras playbook. Les *.conf non gérés restent en place.

- name: Ensure nginx conf.d directory exists.
  file:
    path: "{{ nginx_conf_path }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: "0755"

- name: Inventory existing conf.d files (not managed by the role).
  find:
    paths: "{{ nginx_conf_path }}"
    patterns: "*.conf"
    file_type: file
  register: nginx_confd_existing

- name: Show adopted conf.d files.
  debug:
    msg: >-
      conf.d presents: {{
        nginx_confd_existing.files | map(attribute='path') | map('basename') | list
      }}

- name: Include sites-enabled from conf.d when using package nginx.conf.
  template:
    src: conf.d/00-sites-enabled.conf.j2
    dest: "{{ nginx_conf_path }}/00-sites-enabled.conf"
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
  when:
    - not nginx_manage_main_config | bool
    - nginx_conf_path != nginx_vhost_path
  notify: reload nginx

- name: Drop sites-enabled snippet when nginx.conf already includes it.
  file:
    path: "{{ nginx_conf_path }}/00-sites-enabled.conf"
    state: absent
  when: nginx_manage_main_config | bool
  notify: reload nginx

- name: Deploy enabled library snippets.
  template:
    src: "{{ item.src }}"
    dest: "{{ nginx_conf_path }}/{{ item.name }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
  loop: "{{ nginx_confd_catalog }}"
  when: nginx_confd_enable[item.key] | default(false) | bool
  notify: reload nginx
  loop_control:
    label: "{{ item.name }}"

- name: Remove disabled library snippets.
  file:
    path: "{{ nginx_conf_path }}/{{ item.name }}"
    state: absent
  loop: "{{ nginx_confd_catalog }}"
  when: not (nginx_confd_enable[item.key] | default(false) | bool)
  notify: reload nginx
  loop_control:
    label: "{{ item.name }}"

- name: Deploy extra conf.d files from playbook dir.
  copy:
    src: "{{ item }}"
    dest: "{{ nginx_conf_path }}/{{ item | basename }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
  loop: "{{ query('fileglob', nginx_confd_extra_dir ~ '/*.conf') if nginx_confd_extra_dir else [] }}"
  notify: reload nginx

- name: Deploy extra conf.d entry (template).
  template:
    src: "{{ item.src }}"
    dest: "{{ nginx_conf_path }}/{{ item.dest | default(item.name) }}"
    owner: root
    group: "{{ root_group }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ nginx_confd_extra }}"
  when:
    - item.state | default('present') != 'absent'
    - (item.src | basename) is match('.*\\.j2$')
  notify: reload nginx
  loop_control:
    label: "{{ item.dest | default(item.name | default(item.src)) }}"

- name: Deploy extra conf.d entry (copy).
  copy:
    src: "{{ item.src }}"
    dest: "{{ nginx_conf_path }}/{{ item.dest | default(item.name) }}"
    owner: root
    group: "{{ root_group }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ nginx_confd_extra }}"
  when:
    - item.state | default('present') != 'absent'
    - not ((item.src | basename) is match('.*\\.j2$'))
  notify: reload nginx
  loop_control:
    label: "{{ item.dest | default(item.name | default(item.src)) }}"

- name: Remove extra conf.d entry.
  file:
    path: "{{ nginx_conf_path }}/{{ item.dest | default(item.name) }}"
    state: absent
  loop: "{{ nginx_confd_extra }}"
  when: item.state | default('present') == 'absent'
  notify: reload nginx
  loop_control:
    label: "{{ item.dest | default(item.name | default(item.src)) }}"

- name: Deploy declared conf.d snippets (legacy nginx_confd_files).
  template:
    src: "{{ item.src }}"
    dest: "{{ nginx_conf_path }}/{{ item.name }}"
    owner: root
    group: "{{ root_group }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ nginx_confd_files }}"
  when: item.state | default('present') != 'absent'
  notify: reload nginx
  loop_control:
    label: "{{ item.name }}"

- name: Remove declared conf.d snippets (legacy nginx_confd_files).
  file:
    path: "{{ nginx_conf_path }}/{{ item.name }}"
    state: absent
  loop: "{{ nginx_confd_files }}"
  when: item.state | default('present') == 'absent'
  notify: reload nginx
  loop_control:
    label: "{{ item.name }}"
