---
# nginx.org + blendbyte. Keys in /etc/apt/keyrings (admin third-party).
# Sources: deb822 (.sources) on Debian >= 12, one-line .list otherwise.

- name: Install APT repository prerequisites.
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg2
      - debian-archive-keyring
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Decide APT source format.
  set_fact:
    nginx_apt_use_deb822: >-
      {{
        (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 12)
        or
        (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version | int >= 24)
      }}
  when: nginx_apt_deb822 == 'auto'

- name: Decide APT source format (explicit).
  set_fact:
    nginx_apt_use_deb822: "{{ nginx_apt_deb822 | bool }}"
  when: nginx_apt_deb822 != 'auto'

- name: Ensure APT keyrings directory exists.
  file:
    path: "{{ nginx_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download nginx.org armored signing key.
  get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: "{{ nginx_apt_keyring_dir }}/nginx-archive-keyring.key"
    owner: root
    group: root
    mode: "0644"
  register: nginx_signing_key

- name: Check nginx.org dearmored keyring.
  stat:
    path: "{{ nginx_apt_keyring_dir }}/nginx-archive-keyring.gpg"
  register: nginx_keyring

# gpg --dearmor --yes n'existe pas partout : tmp + install atomique.
- name: Dearmor nginx.org signing key.
  shell: |
    set -euo pipefail
    tmp="$(mktemp)"
    gpg --dearmor --batch < "{{ nginx_apt_keyring_dir }}/nginx-archive-keyring.key" > "$tmp"
    install -o root -g root -m 0644 "$tmp" "{{ nginx_apt_keyring_dir }}/nginx-archive-keyring.gpg"
    rm -f "$tmp"
  args:
    executable: /bin/bash
  when: nginx_signing_key is changed or not nginx_keyring.stat.exists

- name: Remove leftover nginx.org key from /usr/share/keyrings.
  file:
    path: /usr/share/keyrings/nginx-archive-keyring.gpg
    state: absent

- name: Install nginx.org APT source (deb822).
  template:
    src: nginx.sources.j2
    dest: /etc/apt/sources.list.d/nginx.sources
    owner: root
    group: root
    mode: "0644"
  when: nginx_apt_use_deb822 | bool
  register: nginx_apt_source_deb822

- name: Install nginx.org APT source (one-line).
  template:
    src: nginx.list.j2
    dest: /etc/apt/sources.list.d/nginx.list
    owner: root
    group: root
    mode: "0644"
  when: not nginx_apt_use_deb822 | bool
  register: nginx_apt_source_list

# Evite "configured multiple times" si on change de format.
- name: Remove obsolete nginx.org source format.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ '/etc/apt/sources.list.d/nginx.list' if nginx_apt_use_deb822 | bool else '/etc/apt/sources.list.d/nginx.sources' }}"

- name: Pin nginx.org packages over distro nginx.
  template:
    src: nginx.pref.j2
    dest: /etc/apt/preferences.d/99nginx
    owner: root
    group: root
    mode: "0644"

- name: Pin blendbyte nginx-module-* over other origins.
  template:
    src: blendbyte.pref.j2
    dest: /etc/apt/preferences.d/blendbyte-nginx
    owner: root
    group: root
    mode: "0644"
  when: nginx_blendbyte_repo_enabled | bool

- name: Download blendbyte archive keyring.
  get_url:
    url: https://apt.blendbyte.net/nginx/blendbyte-archive-keyring.gpg
    dest: "{{ nginx_apt_keyring_dir }}/blendbyte-archive-keyring.gpg"
    owner: root
    group: root
    mode: "0644"
  when: nginx_blendbyte_repo_enabled | bool
  register: blendbyte_keyring

- name: Remove leftover blendbyte key names.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/blendbyte.gpg
    - /usr/share/keyrings/blendbyte.gpg
    - /usr/share/keyrings/blendbyte-archive-keyring.gpg
  when: nginx_blendbyte_repo_enabled | bool

- name: Install blendbyte APT source (deb822).
  template:
    src: blendbyte.sources.j2
    dest: /etc/apt/sources.list.d/blendbyte.sources
    owner: root
    group: root
    mode: "0644"
  when:
    - nginx_blendbyte_repo_enabled | bool
    - nginx_apt_use_deb822 | bool
  register: blendbyte_apt_source_deb822

- name: Install blendbyte APT source (one-line).
  template:
    src: blendbyte.list.j2
    dest: /etc/apt/sources.list.d/blendbyte.list
    owner: root
    group: root
    mode: "0644"
  when:
    - nginx_blendbyte_repo_enabled | bool
    - not nginx_apt_use_deb822 | bool
  register: blendbyte_apt_source_list

- name: Remove obsolete blendbyte source format.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ '/etc/apt/sources.list.d/blendbyte.list' if nginx_apt_use_deb822 | bool else '/etc/apt/sources.list.d/blendbyte.sources' }}"
  when: nginx_blendbyte_repo_enabled | bool

- name: Refresh APT cache after repository changes.
  apt:
    update_cache: true
  when: >
    (nginx_apt_source_deb822 is defined and nginx_apt_source_deb822 is changed)
    or (nginx_apt_source_list is defined and nginx_apt_source_list is changed)
    or nginx_signing_key is changed
    or (blendbyte_apt_source_deb822 is defined and blendbyte_apt_source_deb822 is changed)
    or (blendbyte_apt_source_list is defined and blendbyte_apt_source_list is changed)
    or (blendbyte_keyring is defined and blendbyte_keyring is changed)
