---
# Debian/nginx.org: vhosts in sites-available, enabled via symlink.

# include conf.d/*.conf ignore default.disabled. On garde le fichier paquet.
- name: Disable package default vhost.
  command: mv -f {{ nginx_default_vhost_path }} {{ nginx_default_vhost_disabled_path }}
  args:
    removes: "{{ nginx_default_vhost_path }}"
  when: nginx_remove_default_vhost | bool
  notify: reload nginx

- name: Remove unused package param files.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/fastcgi.conf
    - /etc/nginx/uwsgi_params
    - /etc/nginx/scgi_params
  notify: reload nginx

- name: Ensure sites-available exists.
  file:
    path: "{{ nginx_sites_available_path }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: "0755"

- name: Ensure sites-enabled exists.
  file:
    path: "{{ nginx_vhost_path }}"
    state: directory
    owner: root
    group: "{{ root_group }}"
    mode: "0755"

# Reliquat paquet Debian : on le gare, on ne le recycle JAMAIS en 000-default.conf
# (sinon force:false skip le template et le catch-all Cytadel n'est jamais pose).
- name: Park leftover Debian sites-available/default.
  command: mv -f {{ nginx_sites_available_path }}/default {{ nginx_sites_available_path }}/default.disabled
  args:
    removes: "{{ nginx_sites_available_path }}/default"
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_filename != 'default'
  notify: reload nginx

- name: Stat default site destination.
  stat:
    path: "{{ nginx_sites_available_path }}/{{ nginx_default_site_filename }}"
  register: nginx_default_site_dest
  when: nginx_default_site_enabled | bool

# Un run precedent a pu mv default → 000-default.conf (contenu stock Debian).
- name: Detect stock Debian content under our default site name.
  command: grep -E 'You should look at the following URL|snippets/snakeoil' {{ nginx_sites_available_path }}/{{ nginx_default_site_filename }}
  register: nginx_default_site_stock
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_dest.stat.exists | default(false)

# Seed si absent. Remplace seulement un reliquat stock Debian (pas un fichier custom).
- name: Deploy default site in sites-available.
  template:
    src: "{{ nginx_default_site_template }}"
    dest: "{{ nginx_sites_available_path }}/{{ nginx_default_site_filename }}"
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
    force: true
  when:
    - nginx_default_site_enabled | bool
    - >-
      not (nginx_default_site_dest.stat.exists | default(false))
      or (nginx_default_site_stock.rc | default(1) == 0)
  notify: reload nginx

- name: Enable default site as 000-default.conf.
  file:
    src: "{{ nginx_sites_available_path }}/{{ nginx_default_site_filename }}"
    dest: "{{ nginx_vhost_path }}/{{ nginx_default_site_link }}"
    state: link
    force: true
  when: nginx_default_site_enabled | bool
  notify: reload nginx

- name: Remove leftover sites-enabled/default symlink.
  file:
    path: "{{ nginx_vhost_path }}/default"
    state: absent
  when:
    - nginx_default_site_enabled | bool
    - nginx_default_site_link != 'default'
  notify: reload nginx

- name: Disable default site.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nginx_vhost_path }}/{{ nginx_default_site_link }}"
    - "{{ nginx_vhost_path }}/{{ nginx_default_site_filename }}"
  when: not nginx_default_site_enabled | bool
  notify: reload nginx

- name: Add managed vhost files in sites-available.
  template:
    src: "{{ item.template | default(nginx_vhost_template) }}"
    dest: "{{ nginx_sites_available_path }}/{{ item.filename | default(item.server_name.split(' ')[0] ~ '.conf') }}"
    force: true
    owner: root
    group: "{{ root_group }}"
    mode: "0644"
  when: item.state | default('present') != 'absent'
  loop: "{{ nginx_vhosts }}"
  notify: reload nginx
  loop_control:
    label: "{{ item.filename | default(item.server_name) }}"

- name: Enable managed vhosts.
  file:
    src: "{{ nginx_sites_available_path }}/{{ item.filename | default(item.server_name.split(' ')[0] ~ '.conf') }}"
    dest: "{{ nginx_vhost_path }}/{{ item.filename | default(item.server_name.split(' ')[0] ~ '.conf') }}"
    state: link
    force: true
  when: item.state | default('present') != 'absent'
  loop: "{{ nginx_vhosts }}"
  notify: reload nginx
  loop_control:
    label: "{{ item.filename | default(item.server_name) }}"

- name: Disable and remove managed vhosts.
  file:
    path: "{{ item.1 }}/{{ item.0.filename | default(item.0.server_name.split(' ')[0] ~ '.conf') }}"
    state: absent
  when: item.0.state | default('present') == 'absent'
  loop: "{{ nginx_vhosts | product([nginx_vhost_path, nginx_sites_available_path]) | list }}"
  notify: reload nginx
  loop_control:
    label: "{{ item.1 }}/{{ item.0.filename | default(item.0.server_name) }}"

- name: Remove legacy vhosts.conf file.
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ nginx_vhost_path }}/vhosts.conf"
    - "{{ nginx_sites_available_path }}/vhosts.conf"
  notify: reload nginx
