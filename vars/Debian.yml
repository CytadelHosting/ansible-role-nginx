---
root_group: root
nginx_conf_path: /etc/nginx/conf.d
nginx_conf_file_path: /etc/nginx/nginx.conf
nginx_mime_file_path: /etc/nginx/mime.types
nginx_pidfile: /run/nginx.pid
nginx_sites_available_path: /etc/nginx/sites-available
nginx_vhost_path: /etc/nginx/sites-enabled
# Package file from nginx.org — not the Debian sites-enabled/default.
nginx_default_vhost_path: /etc/nginx/conf.d/default.conf
nginx_default_vhost_disabled_path: /etc/nginx/conf.d/default.disabled
__nginx_user: "nginx"

# Cytadel Debian defaults (nginx.org + sites-* layout).
nginx_remove_default_vhost: true
nginx_modules_enabled_include: true
nginx_default_site_enabled: true
